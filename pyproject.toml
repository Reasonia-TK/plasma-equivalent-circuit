[project]
name = "plasma-circuit-reproduction"
version = "0.1.0"
description = "Reproduction of the Schmidt et al. global CCP and matching-network model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "scipy>=1.15",
]

[project.scripts]
plasma-reproduce = "plasma_circuit.cli:main"
plasma-validate = "plasma_circuit.validation:main"
plasma-map = "plasma_circuit.operating_map:main"
plasma-esc = "plasma_circuit.esc_cli:main"
plasma-esc-sweep = "plasma_circuit.esc_sweep:main"
plasma-esc-optimize = "plasma_circuit.esc_optimization:main"
plasma-esc-two-zone = "plasma_circuit.esc_two_zone_cli:main"
plasma-esc-two-zone-coupled = "plasma_circuit.esc_two_zone_coupled_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plasma_circuit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
